name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write
  deployments: write


jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Echo projectId and SA email
        shell: bash
        run: |
          python - <<'PY'
          import os, json
          pid = os.getenv('PID','')
          sa  = os.getenv('SA','')
          print('rule-of-life-app', pid)
          try:
            email = json.loads(sa)['client_email']
            print('github-actions-deployer@mood-check-in-399e1.iam.gserviceaccount.com', email)
          except Exception as e:
            print('SA JSON parse error:', e)
            PY
        env:
          PID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          SA:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}


      - name: Sanity check service account can see the project
        run: |
          cat > $RUNNER_TEMP/sa.json <<'JSON'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JSON
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools@latest projects:list --json
          npx firebase-tools@latest apps:list --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" --json || true

      - name: Deploy (Preview for PRs)
        if: ${{ github.event_name == 'pull_request' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: pr-${{ github.event.pull_request.number }}

      - name: Deploy (Production)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
